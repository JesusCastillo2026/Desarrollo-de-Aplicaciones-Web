<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <nav class="d-flex justify-content-between align-items-center mb-4">
        <a class="btn btn-outline-primary" th:href="@{/}">Inicio</a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" th:href="@{/usuarios/usuarios-view}">Usuarios</a>
            <a class="btn btn-outline-secondary" th:href="@{/api/productos}">API de productos</a>
        </div>
    </nav>
    <h2 class="text-center mb-4">Lista de Productos</h2>
    <div class="card shadow">
        <div class="card-body">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productos}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.precio}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
