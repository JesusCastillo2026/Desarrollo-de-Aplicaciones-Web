server.port=8081
spring.application.name=quirofano-api

# Conexion a MySQL en XAMPP
# Crea hospital_db al conectar si fue eliminada; el usuario MySQL necesita permiso CREATE DATABASE.
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Configuracion Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Cuenta local inicial para el primer arranque. Cámbiala después del ingreso.
app.security.bootstrap-admin.username=admin
app.security.bootstrap-admin.email=admin@hospital.local
app.security.bootstrap-admin.password=Admin123!
