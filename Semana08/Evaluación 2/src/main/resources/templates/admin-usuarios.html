<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Usuarios</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-4"><div class="d-flex justify-content-between"><div><h1 class="h3">Administración de usuarios</h1><a th:href="@{/web/solicitudes/home}">← Sistema quirúrgico</a></div><div><a class="btn btn-outline-secondary" th:href="@{/web/admin/roles}">Roles</a> <a class="btn btn-outline-secondary" th:href="@{/web/admin/auditoria}">Auditoría</a> <a class="btn btn-primary" th:href="@{/web/admin/usuarios/nuevo}">Nuevo usuario</a></div></div><div class="alert alert-success mt-3" th:if="${mensaje}" th:text="${mensaje}"></div><div class="alert alert-danger mt-3" th:if="${error}" th:text="${error}"></div><div class="table-responsive mt-3"><table class="table table-striped table-bordered bg-white"><thead><tr><th>Usuario</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="u : ${usuarios}"><td th:text="${u.nombreUsuario}"></td><td th:text="${u.nombres + ' ' + u.apellidos}"></td><td th:text="${u.correo}"></td><td th:text="${u.nombreRol}"></td><td><span class="badge" th:classappend="${u.activo} ? ' text-bg-success' : ' text-bg-secondary'" th:text="${u.activo} ? 'Activo' : 'Inactivo'"></span></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/web/admin/usuarios/{id}/editar(id=${u.idUsuario})}">Editar</a><form class="d-inline" method="post" th:action="@{/web/admin/usuarios/{id}/estado(id=${u.idUsuario})}"><button class="btn btn-sm btn-outline-warning" th:text="${u.activo} ? 'Desactivar' : 'Activar'"></button></form></td></tr></tbody></table></div></main></body></html>
