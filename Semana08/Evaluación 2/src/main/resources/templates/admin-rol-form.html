<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Rol</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-4" style="max-width:650px"><h1 class="h3">Crear o editar rol</h1><form class="card card-body" th:object="${form}" method="post" th:action="@{/web/admin/roles/guardar}"><input type="hidden" name="id" th:if="${id}" th:value="${id}"><label class="form-label">Nombre</label><input class="form-control mb-3" th:field="*{nombreRol}" required><label class="form-label">Descripción</label><textarea class="form-control mb-3" th:field="*{descripcion}" required></textarea><button class="btn btn-primary">Guardar</button> <a class="btn btn-outline-secondary" th:href="@{/web/admin/roles}">Cancelar</a><div class="text-danger" th:if="${#fields.hasAnyErrors()}"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div></form></main></body></html>
