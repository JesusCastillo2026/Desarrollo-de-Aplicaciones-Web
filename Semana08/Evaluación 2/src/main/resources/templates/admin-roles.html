<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Roles</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-4"><div class="d-flex justify-content-between"><h1 class="h3">Administración de roles</h1><div><a class="btn btn-outline-secondary" th:href="@{/web/admin/usuarios}">Usuarios</a> <a class="btn btn-primary" th:href="@{/web/admin/roles/nuevo}">Nuevo rol</a></div></div><div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><table class="table table-bordered bg-white mt-3"><thead><tr><th>Nombre</th><th>Descripción</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="r:${roles}"><td th:text="${r.nombreRol}"></td><td th:text="${r.descripcion}"></td><td th:text="${r.activo} ? 'Activo' : 'Inactivo'"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/web/admin/roles/{id}/editar(id=${r.idRol})}">Editar</a><form class="d-inline" method="post" th:action="@{/web/admin/roles/{id}/estado(id=${r.idRol})}"><button class="btn btn-sm btn-outline-warning" th:text="${r.activo} ? 'Desactivar' : 'Activar'"></button></form></td></tr></tbody></table><a th:href="@{/web/admin/auditoria}">Consultar auditoría reciente →</a></main></body></html>
