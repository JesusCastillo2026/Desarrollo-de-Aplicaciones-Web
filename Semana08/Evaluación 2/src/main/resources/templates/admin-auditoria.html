<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Auditoría</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-4"><h1 class="h3">Auditoría de operaciones</h1><p>Últimas 200 operaciones registradas automáticamente.</p><table class="table table-striped table-bordered bg-white"><thead><tr><th>Fecha y hora</th><th>Usuario</th><th>Operación</th><th>Entidad</th><th>ID registro</th><th>Detalle</th></tr></thead><tbody><tr th:each="a:${eventos}"><td th:text="${a.fechaHora}"></td><td th:text="${a.usuario}"></td><td th:text="${a.operacion}"></td><td th:text="${a.entidad}"></td><td th:text="${a.registroId}"></td><td th:text="${a.detalle}"></td></tr></tbody></table><a class="btn btn-outline-primary" th:href="@{/web/admin/usuarios}">Volver a usuarios</a></main></body></html>
