<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Usuario</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-4" style="max-width:760px"><h1 class="h3" th:text="${modoEdicion} ? 'Editar usuario' : 'Registrar usuario'"></h1><form class="card card-body" th:object="${form}" method="post" th:action="@{/web/admin/usuarios/guardar}"><input type="hidden" name="id" th:if="${modoEdicion}" th:value="${id}"><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Usuario</label><input class="form-control" th:field="*{nombreUsuario}" required></div><div class="col-md-6 mb-3"><label class="form-label">Correo</label><input class="form-control" type="email" th:field="*{correo}" required></div><div class="col-md-6 mb-3"><label class="form-label">Nombres</label><input class="form-control" th:field="*{nombres}" required></div><div class="col-md-6 mb-3"><label class="form-label">Apellidos</label><input class="form-control" th:field="*{apellidos}" required></div><div class="col-md-6 mb-3"><label class="form-label">Contraseña <span th:if="${modoEdicion}">(dejar vacía para conservar)</span></label><input class="form-control" type="password" th:field="*{password}" th:required="${!modoEdicion}" minlength="8"></div><div class="col-md-6 mb-3"><label class="form-label">Rol</label><select class="form-select" th:field="*{rolId}" required><option value="">Seleccione</option><option th:each="r:${roles}" th:value="${r.idRol}" th:text="${r.nombreRol}"></option></select></div><div class="col-12 form-check mb-3 ms-2"><input class="form-check-input" type="checkbox" th:field="*{activo}"><label class="form-check-label">Usuario activo</label></div></div><div class="text-danger mb-2" th:if="${#fields.hasAnyErrors()}"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div><button class="btn btn-primary">Guardar</button> <a class="btn btn-outline-secondary" th:href="@{/web/admin/usuarios}">Cancelar</a></form></main></body></html>
