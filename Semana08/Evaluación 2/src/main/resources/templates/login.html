<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso | Gestión Quirúrgica</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:480px"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-1">Sistema de Gestión Quirúrgica</h1><p class="text-secondary">Inicie sesión con su usuario institucional</p><div class="alert alert-danger" th:if="${param.error}">Usuario o contraseña incorrectos.</div><div class="alert alert-success" th:if="${param.logout}">Sesión cerrada correctamente.</div><form th:action="@{/login}" method="post"><div class="mb-3"><label class="form-label">Usuario</label><input class="form-control" name="username" required autofocus></div><div class="mb-3"><label class="form-label">Contraseña</label><input class="form-control" name="password" type="password" required></div><button class="btn btn-primary w-100">Ingresar</button></form></div></div></main></body></html>
