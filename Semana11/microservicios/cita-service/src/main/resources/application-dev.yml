server:
  port: ${SERVER_PORT:8093}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bd_cita_dev?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  jackson:
    serialization:
      fail-on-empty-beans: false
empresa:
  ambiente: desarrollo
cita:
  url-pacientes: ${PACIENTE_URL:http://localhost:8091}
  url-medicos: ${MEDICO_URL:http://localhost:8092}

