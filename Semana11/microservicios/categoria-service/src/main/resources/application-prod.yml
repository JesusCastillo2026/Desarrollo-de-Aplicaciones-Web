server:
  port: ${SERVER_PORT:9082}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bd_categoria?useSSL=false&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
empresa:
  ambiente: produccion

