server:
  port: ${SERVER_PORT:8084}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bd_pedido_dev?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  jackson:
    serialization:
      fail-on-empty-beans: false
empresa:
  ambiente: desarrollo
pedido:
  url-clientes: ${CLIENTE_URL:http://localhost:8081}
  url-productos: ${PRODUCTO_URL:http://localhost:8083}

