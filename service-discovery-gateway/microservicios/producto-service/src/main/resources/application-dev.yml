server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: producto-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bd_producto_dev?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

producto:
  url-categorias: ${CATEGORIA_URL:http://localhost:8082}

