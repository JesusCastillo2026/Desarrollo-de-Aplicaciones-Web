<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bandeja de Solicitudes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; }
        .fade-in { animation: fadeIn 0.6s ease-in forwards; opacity: 0; }
        @keyframes fadeIn { to { opacity: 1; } }
        .table-container { background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; }
        thead { border-bottom: 3px solid #0d6efd; }
    </style>
</head>
<body class="container mt-5 fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0 text-primary" style="font-weight: bold;">Solicitudes Quirúrgicas</h2>
            <p class="text-muted">Bandeja de programación</p>
        </div>
        <div>
            <a th:href="@{/web/solicitudes/home}" class="btn btn-outline-secondary me-2">Regresar al Inicio</a>
            <a th:href="@{/web/solicitudes/nueva}" class="btn btn-primary">Registrar Nueva</a>
        </div>
    </div>

    <div class="table-container p-0">
        <table class="table table-hover mb-0 text-center align-middle">
            <thead class="table-light text-secondary">
                <tr>
                    <th>ID</th>
                    <th>Paciente</th>
                    <th>Médico</th>
                    <th>Procedimiento</th>
                    <th>Prioridad</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(solicitudes)}">
                    <td colspan="7" class="text-muted py-5">No hay intervenciones programadas.</td>
                </tr>
                <tr th:each="s : ${solicitudes}">
                    <td th:text="${s.idSolicitud}" class="fw-bold">1</td>
                    <td th:text="${s.paciente != null ? s.paciente.nombres + ' ' + s.paciente.apellidos : '-'}">Paciente</td>
                    <td th:text="${s.medicoSolicitante != null ? s.medicoSolicitante.nombres + ' ' + s.medicoSolicitante.apellidos : '-'}">Médico</td>
                    <td th:text="${s.procedimiento}">Procedimiento</td>
                    <td>
                        <span class="badge rounded-pill" th:classappend="${s.prioridad == 'EMERGENCIA' ? 'bg-danger' : (s.prioridad == 'URGENTE' ? 'bg-warning text-dark' : 'bg-secondary')}" th:text="${s.prioridad}"></span>
                    </td>
                    <td>
                        <span class="badge rounded-pill" th:classappend="${s.estado == 'SOLICITADA' ? 'bg-primary' : (s.estado == 'CANCELADA' ? 'bg-danger' : 'bg-success')}" th:text="${s.estado}"></span>
                    </td>
                    <td>
                        <div class="d-inline-flex gap-2">
                            <form th:if="${s.estado != 'CANCELADA'}" th:action="@{/web/solicitudes/{id}/cancelar(id=${s.idSolicitud})}" method="post" onsubmit="return confirm('¿Seguro que desea cancelar la intervención?');">
                                <button type="submit" class="btn btn-sm btn-outline-warning">Cancelar</button>
                            </form>
                            <form th:action="@{/web/solicitudes/{id}/eliminar(id=${s.idSolicitud})}" method="post" onsubmit="return confirm('¿Confirmar eliminación definitiva del registro?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
