<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro Clínico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; }
        .fade-in { animation: fadeIn 0.6s ease-in forwards; opacity: 0; }
        @keyframes fadeIn { to { opacity: 1; } }
        .card { border: none; border-radius: 10px; border-top: 5px solid #0d6efd; }
        .card-header { background-color: white !important; border-bottom: 1px solid #e9ecef; }
        .form-label { font-weight: 600; color: #495057; }
    </style>
</head>
<body class="container mt-5 fade-in mb-5">
    <div class="card shadow-sm">
        <div class="card-header py-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0 text-primary fw-bold">Ficha de Programación Quirúrgica</h4>
            <a th:href="@{/web/solicitudes/home}" class="btn btn-outline-secondary btn-sm">Regresar al Inicio</a>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/web/solicitudes/guardar}" method="post">
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Número de Solicitud:</label>
                        <input type="text" name="numeroSolicitud" class="form-control bg-light" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Fecha Programada:</label>
                        <input type="date" name="fecha" class="form-control bg-light" required>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-4">
                        <label class="form-label">Paciente:</label>
                        <select name="paciente.idPaciente" class="form-select" required>
                            <option value="">-- Seleccione --</option>
                            <option th:each="p : ${pacientes}" th:value="${p.idPaciente}" th:text="${p.nombres + ' ' + p.apellidos}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Médico Tratante:</label>
                        <select name="medicoSolicitante.idMedico" class="form-select" required>
                            <option value="">-- Seleccione --</option>
                            <option th:each="m : ${medicos}" th:value="${m.idMedico}" th:text="${m.nombres + ' ' + m.apellidos}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Historia Clínica:</label>
                        <select name="historiaClinica.idHistoria" class="form-select">
                            <option value="">-- Seleccione --</option>
                            <option th:each="h : ${historias}" th:value="${h.idHistoria}" th:text="${h.numeroHistoria}"></option>
                        </select>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Área de Origen:</label>
                        <select name="origen" class="form-select" required>
                            <option value="">-- Seleccione --</option>
                            <option value="Consulta médica">Consulta Médica</option>
                            <option value="Hospitalización">Hospitalización</option>
                            <option value="Emergencia">Emergencia</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nivel de Prioridad:</label>
                        <select name="prioridad" class="form-select" required>
                            <option value="NORMAL">NORMAL</option>
                            <option value="URGENTE">URGENTE</option>
                            <option value="EMERGENCIA">EMERGENCIA</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Procedimiento a Realizar:</label>
                    <input type="text" name="procedimiento" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Diagnóstico Preoperatorio:</label>
                    <input type="text" name="diagnostico" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Motivo Quirúrgico:</label>
                    <textarea name="motivo" class="form-control" rows="2"></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label">Observaciones Clínicas:</label>
                    <textarea name="observaciones" class="form-control" rows="2"></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/web/solicitudes}" class="btn btn-light border">Cancelar Registro</a>
                    <button type="submit" class="btn btn-primary px-4">Procesar Solicitud</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
