<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema del Quirófano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .fade-in-up { animation: fadeInUp 0.8s ease-out forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        .hospital-card { transition: transform 0.3s ease, box-shadow 0.3s ease; border-top: 5px solid #0d6efd; border-radius: 10px; }
        .hospital-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .header-title { color: #084298; font-weight: bold; }
    </style>
</head>
<body class="container mt-5">
    <div class="text-center mb-5 fade-in-up">
        <h1 class="header-title">Sistema de Gestión Quirúrgica</h1>
        <p class="text-muted">Panel de Control Principal</p>
    </div>

    <div class="row justify-content-center fade-in-up" style="animation-delay: 0.2s;">
        <div class="col-md-5 mb-4">
            <div class="card hospital-card h-100 text-center shadow-sm p-4">
                <div class="card-body">
                    <h4 class="card-title text-primary mb-3">Nueva Solicitud</h4>
                    <p class="card-text text-muted mb-4">Programe una nueva intervención quirúrgica en el sistema.</p>
                    <a th:href="@{/web/solicitudes/nueva}" class="btn btn-primary btn-lg w-100">Registrar Solicitud</a>
                </div>
            </div>
        </div>
        <div class="col-md-5 mb-4">
            <div class="card hospital-card h-100 text-center shadow-sm p-4" style="border-top-color: #198754;">
                <div class="card-body">
                    <h4 class="card-title text-success mb-3">Lista de Solicitudes</h4>
                    <p class="card-text text-muted mb-4">Visualice y gestione las solicitudes programadas.</p>
                    <a th:href="@{/web/solicitudes}" class="btn btn-success btn-lg w-100">Ver Bandeja</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
