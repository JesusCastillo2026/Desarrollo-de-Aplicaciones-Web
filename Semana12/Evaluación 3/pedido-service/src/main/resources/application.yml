server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: pedido-service
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bd_pedido?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
rest:
  services:
    cliente-base-url: ${CLIENTE_SERVICE_URL:http://localhost:8081}
    plato-base-url: ${PLATO_SERVICE_URL:http://localhost:8082}
---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
rest:
  services:
    cliente-base-url: ${CLIENTE_SERVICE_URL}
    plato-base-url: ${PLATO_SERVICE_URL}
